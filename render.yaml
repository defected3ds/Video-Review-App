# Free service template. Existing services can use the same Dockerfile/settings.
# No paid database or disk is provisioned by this file.
services:
  - type: web
    name: pipelife-video-review
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        value: https://hxkssgllgpqcbgvqhqba.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_ID
        sync: false
